[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "throughline"
version = "0.1.0"
description = "Throughline: a security context graph that fuses cloud posture, EDR telemetry and threat-intel impact for human and agent analysts (prototype)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "networkx>=3.3",
  "ladybug>=0.20.4",
  "pyarrow>=16",
  "anthropic>=1.0",
  "orjson>=3.10",
  "python-dotenv>=1.0",
  "sse-starlette>=2.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]
kuzu = ["kuzu==0.11.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
throughline = "throughline.cli:main"

[tool.setuptools.packages.find]
include = ["throughline*"]

[tool.setuptools.package-data]
throughline = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.cypher", "**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check throughline tests scripts
      - name: Build the simulated dataset (JSONL + embedded graph database)
        run: python -m throughline.simulator.build --out data/generated
      - name: Test
        run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Lint
        run: npx oxlint src
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web

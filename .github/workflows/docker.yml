name: docker

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Build (and load for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: throughline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name tl -p 8000:8000 -e DEMO_PASSWORD=ci-secret throughline:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/v1/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/v1/health | tee health.json
          grep -q '"status":"ok"' health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/alerts?limit=1)" = "401"
          curl -fsS -u team:ci-secret "http://127.0.0.1:8000/api/v1/alerts?limit=1" | head -c 300; echo
          curl -fsS -u team:ci-secret http://127.0.0.1:8000/ | grep -qi "<title>"
          docker logs tl | tail -5
          docker rm -f tl
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

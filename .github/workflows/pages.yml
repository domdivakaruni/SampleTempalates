name: pages

# Publishes the static snapshot edition (no backend; every payload precomputed from the simulated graph) to
# GitHub Pages on every push to the branch. Pages must be enabled with "GitHub Actions" as the source
# (Settings -> Pages); actions/configure-pages tries to enable it automatically.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    # The static edition lands in stages; skip cleanly on commits that do not carry the build script yet.
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          if [ -f scripts/build_static.sh ] && [ -f scripts/export_snapshot.py ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "static build scripts not present on this commit; nothing to deploy"; fi
  build:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -e .
          cd web && npm ci --no-audit --no-fund
      - name: Build the dataset and the static snapshot edition
        run: bash scripts/build_static.sh --export
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-static
  deploy:
    needs: [check, build]
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
